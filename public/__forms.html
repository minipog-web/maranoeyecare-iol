<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Marano Eye Care Forms</title>
  </head>
  <body>
    <!-- Static form definition required by @netlify/plugin-nextjs v5 for Netlify Forms detection -->
    <form
      name="consultation"
      data-netlify="true"
      netlify-honeypot="bot-field"
      method="POST"
      hidden
    >
      <input type="hidden" name="form-name" value="consultation" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="preferredContact" />
      <input type="text" name="location" />
      <input type="text" name="lens" />
      <input type="text" name="quizResult" />
      <textarea name="message"></textarea>
      <input type="hidden" name="gclid" />
      <input type="hidden" name="wbraid" />
      <input type="hidden" name="gbraid" />
      <input type="hidden" name="utmSource" />
      <input type="hidden" name="utmMedium" />
      <input type="hidden" name="utmCampaign" />
      <input type="hidden" name="utmTerm" />
      <input type="hidden" name="utmContent" />
      <input type="hidden" name="landingPage" />
      <input type="hidden" name="referrer" />
    </form>
  </body>
</html>
